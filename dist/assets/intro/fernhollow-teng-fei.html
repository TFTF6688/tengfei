<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src blob:; base-uri 'none'; form-action 'none'">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="滕飞的视觉设计作品集开场。">
  <title>滕飞 · 作品集开场</title>
  <link rel="stylesheet" href="intro.css?v=1">
</head>
<body>
  <div id="valley" class="scene-loading" aria-hidden="true">
    <div class="backdrop"></div>
    <div class="js-canvas-container"></div>
  </div>

  <div class="ui" id="ui" inert>
    <header>
      <span class="logo">滕飞 <span lang="en">/ TENG FEI</span></span>
      <nav aria-label="作品集导航">
        <button type="button" data-portfolio-action="works">作品</button>
        <button type="button" data-portfolio-action="about">关于</button>
        <button type="button" data-portfolio-action="contact">联系</button>
        <button type="button" class="pill skip-link" data-portfolio-action="skip">跳过开场</button>
      </nav>
    </header>
    <main class="hero">
      <h1 lang="en">Grown, not built.</h1>
      <p class="cap">让想象，成为看得见的价值。</p>
      <button class="go" id="go" type="button" aria-label="立即开始" data-portfolio-action="enter">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg>
      </button>
    <span class="action-caption" aria-hidden="true">立即开始</span>
    </main>
    <div class="corner">
      <span id="wander">滚动或滑动探索</span><i aria-hidden="true"></i>
      <button class="sound" id="sound" type="button" aria-pressed="false" aria-label="环境音">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9.5v5h3.5L12 18V6L7.5 9.5Z"/>
          <path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
          <path class="cross" d="m16 10 4 4m0-4-4 4"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="loader" id="loader" aria-hidden="true"><span></span></div>
  <noscript><style>.loader, .go, .corner { display: none; } .ui { opacity: 1; } .backdrop { visibility: visible; }</style></noscript>
  
  <script src="intro-bridge.js?v=1" defer></script>

















  <script src="intro-player.js?v=3" defer></script>
</body>
</html>
